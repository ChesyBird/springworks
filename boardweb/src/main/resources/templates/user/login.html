<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="p-5 mb-4 text-center bg-light">
        <h1 class="mb-2">
            <a th:href="@{/}" class="text-decoration-none">My Board</a>
        </h1>
    </div>

    <div class="container" style="max-width: 420px">
        <h2 class="mb-4">로그인</h2>
        <!-- 오류 문구 영역 -->
        <!-- /login?signup : 회원가입 직후 -->
        <div th:if="${param.signup}" class="alert alert-success">회원가입이 완료되었습니다. 로그인 해주세요.</div>
        <!-- 로그인 오류 -->
        <div th:if="${param.error}" class="alert alert-danger">아이디 또는 비밀번호가 올바르지 않습니다.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-lebel mb-2">아이디</label>
                <input type="text" class="form-control"
                       id="username" name="username" required
                       placeholder="아이디를 입력하세요"
                >
            </div>
            <div class="mb-3">
                <label for="password" class="form-lebel mb-2">비밀번호</label>
                <input type="password" class="form-control"
                       id="password" name="password" required
                       placeholder="비밀번호를 입력하세요"
                >
            </div>
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>
    </div>
    <p class="text-center mt-3">아직 계정이 없으시다면 <a th:href="@{/signup}">회원 가입</a></p>
</body>
</html>
